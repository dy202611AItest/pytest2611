[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
xfail_strict = true
markers = [
    "smoke: 冒烟用例，提交前必跑（-m smoke）",
    "slow: 慢用例，可选跳过（-m 'not slow'）",
]

[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true

[tool.coverage.report]
skip_empty = true
show_missing = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "plugins"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["calc", "plugins"]

[tool.ruff.format]
quote-style = "double"
