name: CI

# 触发时机：
#   push main        —— 合并后立刻验证
#   pull_request     —— PR 阶段拦截问题（fork 的 PR 拿不到 secret，企业微信会跳过发送）
#   workflow_dispatch —— 手动重跑
#   schedule         —— 每天夜间回归一次（UTC 18:00 = 北京时间 02:00）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

# 同一个分支连续提交时，取消上一次还在跑的流水线，省 runner 额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # --output-format=github 会把告警直接标在 PR 的 diff 行上
      - name: Ruff check
        run: python -m ruff check --output-format=github .

      - name: Ruff format check
        run: python -m ruff format --check --diff .

  test:
    name: Test / ${{ matrix.os }} / py${{ matrix.python-version }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # 报告插件在 GITHUB_ACTIONS=true 时会自动写 Job Summary / 失败注解 / outputs；
      # WECOM_WEBHOOK 没配置时插件只提示"未配置"，不会让构建失败。
      - name: Run tests (report + coverage)
        shell: bash
        env:
          OS_NAME: ${{ matrix.os }}
          PY_VERSION: ${{ matrix.python-version }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          python -m pytest \
            --report-dir reports \
            --report-title "CI 测试报告（${OS_NAME} / Python ${PY_VERSION}）" \
            --report-send on-failure \
            --junitxml reports/junit.xml \
            --cov --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov

      # 无论成功失败都保留报告，方便排查；CD 流水线也靠这个产物发布 Pages
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.python-version }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  ci-success:
    name: CI Success
    # 用于分支保护规则：只要求这一个检查通过即可，新增 matrix 组合不用改规则
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "test: ${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
